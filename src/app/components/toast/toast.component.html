<!-- Toast Container -->
<div class="fixed top-20 right-4 z-50 space-y-3 max-w-sm">
  <div 
    *ngFor="let toast of toasts$ | async" 
    [class]="'flex items-center p-4 rounded-lg border-l-4 shadow-lg transition-all duration-300 ease-in-out transform ' + getToastClasses(toast.type)"
    style="animation: slideIn 0.3s ease-out;">
    
    <!-- Icon -->
    <div class="flex-shrink-0">
      <i [class]="getToastIcon(toast.type) + ' text-2xl ' + getIconColor(toast.type)"></i>
    </div>
    
    <!-- Message -->
    <div class="ml-3 flex-1">
      <p class="text-sm font-medium">{{ toast.message }}</p>
    </div>
    
    <!-- Close Button -->
    <button 
      (click)="closeToast(toast.id)"
      class="ml-3 flex-shrink-0 text-gray-400 hover:text-gray-600 focus:outline-none transition-colors">
      <i class="fas fa-times"></i>
    </button>
  </div>
</div>
